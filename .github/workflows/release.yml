# Release Please maintains the release PR and, after that PR is merged, creates
# the version tag and GitHub Release. See docs/release-process.md.
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge history for release diagnostics
        uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Show commit subjects used for release detection
        run: |
          echo "Conventional Commit subjects on main (first-parent history):"
          git log --first-parent -n 15 --pretty=format:'%h %s'
          echo
      - name: Create or update release PR
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
