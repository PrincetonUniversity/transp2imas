# Portable source-only CI. Keep this job free of site-specific IMAS dependencies;
# DD/schema and end-to-end conversion checks are documented separately.
name: Source checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install source-check dependencies
        run: python -m pip install --upgrade pip numpy scipy matplotlib PyYAML -r requirements-curation.txt

      - name: Enforce headers, compile, and run quick checks
        env:
          MPLBACKEND: Agg
        run: make check PYTHON=python

      - name: Run source regression checks
        run: make verify-all PYTHON=python
