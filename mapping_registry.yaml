# ---- edge_sources: gas-flow (GF) and recycling (RC) neutral origins ------------------------

- id: es_ionization_particles
  kind: direct_typed
  writer: edge_sources
  ids: [edge_sources]
  source: ['SEGF_?', 'SERC_?', SERECO]
  destination: {'4': source/ggd/electrons/particles/values, '3': source/ggd/electrons/particles/values}
  units: '1/(cm^3 s) -> 1/(m^3 s)'
  transform: "atomic_ionization source per neutral (SERECO is the re-ionisation of recombination neutrals, only when one species is resolved): electron source = SE*; the same rate goes to the ion particle source and, negated, to the neutral particle sink (SE* not SI*, because SI* includes the charge-exchange ion)"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: es_ionization_energy
  kind: direct_typed
  writer: edge_sources
  ids: [edge_sources]
  source: ['PIGF_?', 'PIRC_?', PIRECO]
  destination: {'4': source/ggd/ion/energy/values, '3': source/ggd/ion/energy/values}
  units: 'W/cm^3 -> W/m^3'
  transform: "atomic_ionization source: kinetic-energy transfer, ion +, neutral -"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: es_ionization_momentum
  kind: direct_typed
  writer: edge_sources
  ids: [edge_sources]
  source: ['TQIGF_?', 'TQIRC_?', TQIRECO]
  destination: {'4': source/ggd/ion/momentum/phi}
  units: 'N*m/cm^3 -> N*m/m^3'
  transform: "atomic_ionization source: torque, ion +, neutral -; written for DD >= 3.42 only, DD 3.39 ties the toroidal component to the radial one so the component is skipped with a recorded reason"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: es_cx_particles
  kind: direct_typed
  writer: edge_sources
  ids: [edge_sources]
  source: ['SFCXGF_?', 'SFCXRC_?', SFCXRECO]
  destination: {'4': source/ggd/ion/particles/values, '3': source/ggd/ion/particles/values}
  units: '1/(cm^3 s) -> 1/(m^3 s)'
  transform: "charge_exchange source: ion born from the neutral +, neutral -"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: es_cx_energy
  kind: direct_typed
  writer: edge_sources
  ids: [edge_sources]
  source: ['PCXGF_?', 'PCXRC_?', PCXRECO]
  destination: {'4': source/ggd/total_ion_energy/values, '3': source/ggd/total_ion_energy/values}
  units: 'W/cm^3 -> W/m^3'
  transform: "charge_exchange source: PCX is a transfer to the neutrals, so total_ion_energy is negated and neutral energy is positive (the donor fast ion is not resolved)"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: es_cx_momentum
  kind: direct_typed
  writer: edge_sources
  ids: [edge_sources]
  source: ['TQCXGF_?', 'TQCXRC_?', TQCXRECO]
  destination: {'4': source/ggd/momentum/phi}
  units: 'N*m/cm^3 -> N*m/m^3'
  transform: "charge_exchange source: TQCX is a transfer to the neutrals, so aggregate momentum is negated and neutral momentum positive; DD >= 3.42 only (see es_ionization_momentum)"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: es_recombination_particles
  kind: derived_typed
  writer: edge_sources
  ids: [edge_sources]
  source: [S0RECO, 'S0V0?', 'S0V0??']
  destination: {'4': source/ggd/neutral/particles/values, '3': source/ggd/neutral/particles/values}
  units: '1/(cm^3 s) -> 1/(m^3 s)'
  transform: "recombination source: neutral particles = S0V0<s> when exactly one species is resolved (then electrons and ion particles get the same rate with a negative sign, one ion and one electron consumed per neutral), else the unresolved total S0RECO on a recombination_neutral_total entry"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: es_recombination_energy
  kind: direct_typed
  writer: edge_sources
  ids: [edge_sources]
  source: [P0RECO]
  destination: {'4': source/ggd/neutral/energy/values, '3': source/ggd/neutral/energy/values}
  units: 'W/cm^3 -> W/m^3'
  transform: "recombination source: kinetic energy carried by the born neutral; the plasma-side energy partition is not resolved by TRANSP and is not invented"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: es_recombination_momentum
  kind: direct_typed
  writer: edge_sources
  ids: [edge_sources]
  source: [TQ0RECO]
  destination: {'4': source/ggd/neutral/momentum/phi}
  units: 'N m/cm^3 -> N m/m^3'
  transform: "recombination source: torque carried by the born neutral; DD >= 3.42 only (see es_ionization_momentum)"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: deferred_edge_species_ion_sources
  kind: deferred
  source: ['SIGF_?_?', 'SIRC_?_?']
  read_by: [edge_sources]
  reason: 'species-resolved ion sources are read to build a neutral-loss term that is not exported; the electron source SE* sets the particle stoichiometry because SI* = SE* + SFCX*'

