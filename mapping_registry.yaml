- id: eq_betas
  kind: derived_typed
  writer: equilibrium
  ids: [equilibrium]
  source: [PTOWB, DVOL, PCURC, BZXR, RLIM, RAXIS, 'RMCB?', 'RMCB??', 'RMSB?', 'RMSB??']
  destination: {'4': time_slice/global_quantities/beta_tor, '3': time_slice/global_quantities/beta_tor}
  units: 'Pa, m^3, A, T -> 1'
  transform: "the Data Dictionary definitions against this IDS's own b0 and r0, from the total pressure PTOWB: beta_tor = 2 mu0 (sum PTOWB*DVOL / sum DVOL) / b0^2; beta_pol = 4 sum PTOWB*DVOL / (r0 mu0 Ip^2); beta_tor_norm = 100 beta_tor a b0 / Ip[MA] with a = (Rmax-Rmin)/2 of the boundary rebuilt from the RMCB/RMSB moments (1-2% from the traced outline). TRANSP's BTEQ is 2 mu0 <PTOWB>/(BZXR^2 <1/R^2>) and BETAT/BPEQ use a poloidal-field average, so they are different definitions and are not copied"
  sign: 'beta_tor_norm keeps the signs of b0 and Ip (bt_sign*ip_sign); beta_tor and beta_pol are positive'
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

