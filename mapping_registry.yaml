# ---- sawteeth (writer-verified on synthetic and bundled CDFs) --------------------------------

- id: sawteeth_previous_crash_time
  kind: direct_typed
  writer: sawteeth
  ids: [sawteeth]
  source: [TLASTSAW]
  destination: {'4': diagnostics/previous_crash_time, '3': diagnostics/previous_crash_time}
  units: 's -> s'
  transform: "TLASTSAW(TIME) is the most recent crash time at each sample; the IDS is written only if it changes (a constant initial value is a left-censored baseline, not an event)"
  verification: writer_verified
  tests: [examples/verify_sawteeth_mapping.py]

- id: sawteeth_previous_period
  kind: derived_typed
  writer: sawteeth
  ids: [sawteeth]
  source: [TLASTSAW]
  destination: {'4': diagnostics/previous_period, '3': diagnostics/previous_period}
  units: 's -> s'
  transform: "difference of successive reported crash times, only after two observed crash updates; samples before the first full period carry the IMAS missing value"
  verification: writer_verified
  tests: [examples/verify_sawteeth_mapping.py]

- id: sawteeth_q1_radius
  kind: direct_typed
  writer: sawteeth
  ids: [sawteeth]
  source: [XIQ1]
  destination: {'4': diagnostics/rho_tor_norm_q1, '3': diagnostics/rho_tor_norm_q1}
  units: '1 -> 1'
  transform: "normalised toroidal-flux radius of the q=1 surface; samples outside (0, 1] (negative absence sentinels) become the IMAS missing value, never zero"
  verification: writer_verified
  tests: [examples/verify_sawteeth_mapping.py]

# ---- reviewed and intentionally not mapped -------------------------------------------------

- id: deferred_boundary_sources
  kind: deferred
  source: [T0RECYC, T0GASFL, OM0RECYC, OM0GASFL, E0INR]
  reason: 'neutral/source-state quantities with no audited IMAS destination'

- id: deferred_boundary_energy
  kind: deferred
  source: [PEEDG, PIEDG]
  reason: 'energy crossing the plasma boundary, not a volumetric source'

- id: deferred_neoclassical_velocity
  kind: deferred
  source: ['VPOL?_NC', 'VTOR?_NC']
  read_by: [core_profiles]
  reason: 'RMAJM-grid (101 midplane points) velocities; core_profiles reads them and exports only if a CDF provides them on the profile grid'

- id: deferred_aggregate_fluxes
  kind: deferred
  source: [GFLNC_I, GFLNC_X, GFLNC_TOK, QFLNC_X, QFLNC_TOK, QFLNCC_X, QFLNCC_TOK]
  reason: 'aggregate divergences; no typed total destination and no extra ion species is invented'

- id: deferred_ic_spectrum
  kind: deferred
  source: [PIC_NPHI, 'PICF??N??']
  reason: 'frequency/n_phi-resolved IC families need a dedicated spectral mapping audit'

- id: deferred_ripple_torque
  kind: deferred
  source: [TQRPL, FTQRIP]
  read_by: [core_sources]
  reason: 'ripple torque weight FTQRIP is not in the CDF; TQRPL is read only to warn that it is excluded from the NBI momentum sum'

- id: deferred_impurity_charge_profile
  kind: deferred
  source: ['ZIMPS_*']
  read_by: [core_profiles]
  reason: 'mean impurity charge profile is read for bookkeeping, but ion/z_ion_1d is deliberately not written (the per-charge-state NIMP_* densities carry the charge resolution)'

- id: deferred_symmetric_major_radius
  kind: deferred
  source: [RMJSYM]
  read_by: [core_profiles]
  reason: 'read only for an angular-velocity to velocity conversion that is not used; rotation is exported as frequency'

- id: deferred_sawtooth_adhoc_boundary
  kind: deferred
  source: [XSAWBOUND]
  read_by: [sawteeth]
  reason: 'TRANSP labels it an ad-hoc sawtooth boundary; nothing proves it is a mixing or inversion radius, so it is only counted and a warning is logged'

# ---- read to build other mappings ----------------------------------------------------------

- id: input_time_grids
  kind: input_consumed
  source: [TIME, TIME3]
  reason: 'native time bases for every writer'

- id: input_geometry
  kind: input_consumed
  source: [X, XB, DVOL, DAREA, SURF, BZ]
  reason: 'coordinates and zone geometry used to normalise and integrate'
