# ---- equilibrium: MHD energy, geometric axes, outline, 2D field; poloidal-flux grid ---------

- id: eq_energy_mhd
  kind: derived_typed
  writer: equilibrium
  ids: [equilibrium]
  source: [PMHD, DVOL]
  destination: {'4': time_slice/global_quantities/energy_mhd, '3': time_slice/global_quantities/energy_mhd}
  units: 'Pa, cm^3 -> J'
  transform: "energy_mhd = 1.5*sum(PMHD*DVOL) with PMHD the equilibrium-solver pressure (the summary IDS uses PTOWB instead)"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: eq_profile_geometric_axis
  kind: direct_typed
  writer: equilibrium
  ids: [equilibrium]
  source: [RMC00, YMC00, RMJMP]
  destination: {'4': time_slice/profiles_1d/geometric_axis/r, '3': time_slice/profiles_1d/geometric_axis/r}
  units: 'cm -> m'
  transform: "zeroth Fourier moments RMC00/YMC00 are the geometric centres of each flux surface (z likewise); RMJMP is a radial-only fallback for CDFs without moments"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: eq_boundary_geometric_axis
  kind: derived_typed
  writer: equilibrium
  ids: [equilibrium]
  source: [RMCB0, YMCB0]
  destination: {'4': time_slice/boundary/geometric_axis/r, '3': time_slice/boundary/geometric_axis/r}
  units: 'cm -> m'
  transform: "geometric centre of the boundary: RMCB0/YMCB0, else the centroid of the traced outline, else the last RMC00/YMC00 surface; the same point goes to global_quantities/geometric_axis"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: eq_boundary_outline
  kind: derived_typed
  writer: equilibrium
  ids: [equilibrium]
  source: [PLFLXA, PBPMHD, PSIRZ, RGRID, ZGRID, RAXIS, YAXIS]
  destination: {'4': time_slice/boundary/outline/r, '3': time_slice/boundary/outline/r}
  units: 'Wb/rad, cm -> m'
  transform: "LCFS outline contoured on the rectangular flux map PSIRZ at the enclosed-flux level PLFLXA (PBPMHD when absent), on the closed curve around the axis; a clamped map falls back to the nearest existing level and records it; with --moments yes the TRANSP boundary moments are used instead"
  verification: writer_verified
  tests: [examples/verify_equilibrium_boundary_trace.py]

- id: eq_profile_2d_b_field
  kind: direct_typed
  writer: equilibrium
  ids: [equilibrium]
  source: [B_FIELD]
  destination: {'4': time_slice/profiles_2d/b_field_r, '3': time_slice/profiles_2d/b_field_r}
  units: 'T -> T'
  transform: "B_FIELD(3, nz, nr) = B_R, B_phi, B_Z on the PSIRZ grid, transposed to (nr, nz); B_phi goes to b_field_phi (DD3.39: b_field_tor)"
  sign: 'B_R and B_Z follow poloidal_field_sign, B_phi follows bt_sign'
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: grid_poloidal_flux_core_sources
  kind: derived_typed
  writer: core_sources
  ids: [core_sources]
  source: [PLFLX, PSI0_TR, X, XB]
  destination: {'4': source/profiles_1d/grid/rho_pol_norm, '3': source/profiles_1d/grid/rho_pol_norm}
  units: 'Wb/rad -> Wb, 1'
  transform: "psi = psi_sign*2*pi*(PLFLX interpolated XB -> X with a zero at the axis + PSI0_TR); rho_pol_norm = sqrt((psi - psi_axis)/(psi_boundary - psi_axis)); the shared grid helper writes grid/psi from the same psi"
  sign: psi_sign
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: grid_poloidal_flux_radiation
  kind: derived_typed
  writer: radiation
