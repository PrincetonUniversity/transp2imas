  units: 'Wb'
  transform: "the flux of the traced outline: the edge of profiles_1d/psi (enclosed flux PLFLX2PI[-1] plus the absolute axis value 2*pi*PSI0_TR); global_quantities/psi_boundary carries the same value. The outline is traced on PSIRZ at the enclosed-flux level PLFLXA"
  sign: psi_sign
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: eq_boundary_separatrix_psi
  kind: derived_typed
  writer: equilibrium
  ids: [equilibrium]
  source: [PBPMHD, PSI0_TR]
  destination: {'3': time_slice/boundary_separatrix/psi}
  units: 'Wb/rad -> Wb'
  transform: "DD3 only (removed in DD4): the equilibrium bounding-point flux 2*pi*PBPMHD, which is relative to the magnetic axis, plus the absolute axis value 2*pi*PSI0_TR"
  sign: psi_sign
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: eq_profile_2d_psi
  kind: derived_typed
  writer: equilibrium
  ids: [equilibrium]
  source: [PSIRZ, PSI0_TR, RGRID, ZGRID]
  destination: {'4': time_slice/profiles_2d/psi, '3': time_slice/profiles_2d/psi}
  units: 'Wb/rad -> Wb'
  transform: "2*pi*PSIRZ (relative to the magnetic axis) plus the absolute axis value 2*pi*PSI0_TR, so the 2-D flux shares the reference of profiles_1d/psi and psi_magnetic_axis; the boundary is traced on the relative field"
  sign: psi_sign
  verification: readback_verified
  tests: [examples/verify_registry_values.py]


# ---- summary (global_quantities/<name>/value; readback-verified on ITER 38530P94) ---------

- id: sm_plasma_current
  kind: direct_typed
  writer: summary
  ids: [summary]
  source: [PCURC]
  destination: {'4': global_quantities/ip/value, '3': global_quantities/ip/value}
  units: 'A -> A'
  transform: "calculated plasma current"
  sign: ip_sign
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: sm_direct_scalars
  kind: direct_typed
  writer: summary
  ids: [summary]
  source: [LI_3, VSURC, PVOL, Q95, TAUA1, H98Y2, TAUE98Y2, LHMODE]
  destination: {'4': global_quantities/li_3/value, '3': global_quantities/li/value}
  units: 'V, 1, m^3, s'
  transform: "LI_3 -> li_3 (DD3 li); VSURC -> v_loop; PVOL (cm^3 -> m^3) -> volume; Q95 -> q_95; TAUA1 -> tau_energy; H98Y2 -> h_98; TAUE98Y2 -> tau_energy_98; LHMODE (rounded) -> h_mode"
  sign: vloop_sign, q_sign
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: sm_vacuum_field
  kind: derived_typed
  writer: summary
  ids: [summary]
  source: [RLIM, RAXIS, BZXR]
  destination: {'4': global_quantities/b0/value, '3': global_quantities/b0/value}
  units: 'cm, T*cm -> m, T'
  transform: "one constant r0 (middle of the limiter RLIM, else the mean of first and last RAXIS) and b0 = bt_sign*BZXR/r0, shared with vacuum_toroidal_field in every IDS"
  sign: bt_sign
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: sm_betas
  kind: derived_typed
  writer: summary
  ids: [summary]
  source: [PTOWB, DVOL, PCURC, BZXR, RLIM, RAXIS, 'RMCB?', 'RMCB??', 'RMSB?', 'RMSB??']
  destination: {'4': global_quantities/beta_tor_norm/value, '3': global_quantities/beta_tor_norm/value}
  units: 'Pa, m^3, A, T -> 1'
  transform: "the Data Dictionary definitions against this IDS's own b0 and r0, from the total pressure PTOWB: beta_tor = 2 mu0 (sum PTOWB*DVOL / sum DVOL) / b0^2; beta_pol = 4 sum PTOWB*DVOL / (r0 mu0 Ip^2); beta_tor_norm = 100 beta_tor a b0 / Ip[MA] with a = (Rmax-Rmin)/2 of the boundary rebuilt from the RMCB/RMSB moments (1-2% from the traced outline). TRANSP's BTEQ is 2 mu0 <PTOWB>/(BZXR^2 <1/R^2>) and BETAT/BPEQ use a poloidal-field average, so they are different definitions and are not copied"
  sign: 'beta_tor_norm keeps the signs of b0 and Ip (bt_sign*ip_sign); beta_tor and beta_pol are positive'
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: sm_energies
  kind: derived_typed
  writer: summary
  ids: [summary]
  source: [UTOTL, UTHRM, UE, UI, PTOWB, PPLAS, UFASTPP, UFASTPA, DVOL]
  destination: {'4': global_quantities/energy_total/value, '3': global_quantities/energy_total/value}
  units: 'J/cm^3 -> J'
  transform: "energy_total/thermal/electrons_thermal/ion_total_thermal are sum(U*DVOL) (no 3/2 factor); energy_mhd = 1.5*sum(PTOWB*dV); energy_diamagnetic = 1.5*sum((PPLAS+UFASTPP)*dV); energy_fast_perpendicular = 1.5*sum(UFASTPP*dV); energy_fast_parallel = 3*sum(UFASTPA*dV) because UFASTPA = p_parallel/2"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: sm_poloidal_field_energy
  kind: derived_typed
  writer: summary
  ids: [summary]
  source: [BPOL, X, XB, DVOL]
  destination: {'4': global_quantities/energy_b_field_pol/value, '3': global_quantities/energy_b_field_pol/value}
  units: 'T -> J'
  transform: "BPOL interpolated from XB to X with 0 at the axis, then sum(Bpol^2/(2 mu0) dV)"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: sm_currents
  kind: derived_typed
  writer: summary
  ids: [summary]
  source: [CUROH, CUR, CURBS, DAREA]
  destination: {'4': global_quantities/current_ohm/value, '3': global_quantities/current_ohm/value}
  units: 'A/cm^2 * cm^2 -> A'
  transform: "current_ohm = sum(CUROH*DAREA); current_non_inductive = sum((CUR-CUROH)*DAREA); current_bootstrap = sum(CURBS*DAREA)"
  sign: ip_sign
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: sm_powers
  kind: derived_typed
  writer: summary
  ids: [summary]
  source: [POHT, PRAD, PRAD_BR, PRAD_LI, PRAD_CY, PINJ, DVOL]
  destination: {'4': global_quantities/power_ohm/value, '3': global_quantities/power_ohm/value}
  units: 'W, W/cm^3 -> W'
  transform: "power_ohm = POHT; power_radiated and power_radiated_inside_lcfs = sum(PRAD*DVOL); bremsstrahlung = PRAD_BR, line = PRAD_LI, synchrotron = PRAD_CY (volume integrals); heating_current_drive/power_launched_nbi = PINJ (BPCAP is deliberately not mapped to power_nbi)"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]

- id: sm_neutron_rates
  kind: derived_typed
  writer: summary
  ids: [summary]
  source: [NEUTT, NEUTX, NEUTX_DD, BTNTS_DD, BBNTS_DD]
  destination: {'4': fusion/neutron_rates/total/value, '3': fusion/neutron_rates/total/value}
  units: 'N/s'
  transform: "total, thermal and the DD thermal / beam-thermal / beam-beam channels; dd/total is their sum"
  verification: readback_verified
  tests: [examples/verify_registry_values.py]


